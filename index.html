<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0a0d1a" />
<title>QRバトル</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&display=swap" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="identityBar" class="identity-bar">
  <div class="identity-avatar" id="identityAvatar">⚔️</div>
  <div class="identity-name" id="identityName">QRバトル</div>
</div>
<div id="app"></div>

<div id="popupOverlay" class="popup-overlay" hidden>
  <div class="popup-box">
    <div class="popup-title" id="popupTitle"></div>
    <div class="popup-body" id="popupBody"></div>
    <button class="btn secondary block" id="popupCloseBtn">閉じる</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="js/rng.js"></script>
<script src="js/character.js"></script>
<script src="js/battle.js"></script>
<script src="js/app.js"></script>
</body>
</html>
